<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark" data-pal="classic">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5eff" id="meta-theme">
<title>4C</title>
<style>
/* =========================================================
   রঙের সেট (palette): ৪টা ভূমিকা
   --pri = প্রধান (চিহ্ন, বোতাম)   --sec = দ্বিতীয় (চালু, সক্রিয়)
   --dan = বিপদ (C, থামুন)        --acc = হাইলাইট (=, 2nd)
   ========================================================= */
:root, :root[data-pal="classic"]{
  --pri:#1f5eff; --pri-l:#3d78ff; --pri-d:#0b43d9;
  --sec:#00a94f; --sec-l:#1fd36e;
  --dan:#e5262d; --dan-l:#ff4b4b;
  --acc:#ffc400; --acc-d:#ff9f00; --acc-ink:#1a1300;
}
:root[data-pal="ocean"]{
  --pri:#0077b6; --pri-l:#1a94d6; --pri-d:#025a8c;
  --sec:#00a99d; --sec-l:#2ee6d6;
  --dan:#ef476f; --dan-l:#ff6b8b;
  --acc:#ffd166; --acc-d:#f7a531; --acc-ink:#2a1d00;
}
:root[data-pal="sunset"]{
  --pri:#7b2ff7; --pri-l:#9a5cff; --pri-d:#5a12d6;
  --sec:#e8177a; --sec-l:#ff5ca8;
  --dan:#ff3d00; --dan-l:#ff6a33;
  --acc:#ffb300; --acc-d:#ff8f00; --acc-ink:#2a1600;
}
:root[data-pal="forest"]{
  --pri:#047857; --pri-l:#10b981; --pri-d:#065f46;
  --sec:#5c9a0b; --sec-l:#84cc16;
  --dan:#e11d48; --dan-l:#fb7185;
  --acc:#f59e0b; --acc-d:#d97706; --acc-ink:#2a1700;
}
:root[data-pal="royal"]{
  --pri:#4338ca; --pri-l:#6366f1; --pri-d:#312e81;
  --sec:#0d9488; --sec-l:#2dd4bf;
  --dan:#be123c; --dan-l:#f43f5e;
  --acc:#eab308; --acc-d:#ca8a04; --acc-ink:#231a00;
}

/* =========================================================
   থিম (পটভূমি): light, dark, amoled, midnight, sepia
   ========================================================= */
:root, :root[data-theme="light"]{
  --bg:#eef2f8; --surface:#ffffff; --surface2:#f4f6fb; --key:#ffffff; --key2:#e3e9f2;
  --text:#0b1220; --muted:#56657d; --line:#d7dfea; --sh:#c6d0de; --blob:20%;
  --alt:color-mix(in srgb, var(--acc-d) 70%, #000);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#060a13; --surface:#0e1525; --surface2:#131c30; --key:#172138; --key2:#202c47;
  --text:#f3f6fb; --muted:#8d9bb4; --line:#223051; --sh:#02050b; --blob:20%; --alt:var(--acc);
  color-scheme:dark;
}
:root[data-theme="amoled"]{
  --bg:#000000; --surface:#0a0a0a; --surface2:#111111; --key:#141414; --key2:#1f1f1f;
  --text:#ffffff; --muted:#9a9a9a; --line:#262626; --sh:#000000; --blob:0%; --alt:var(--acc);
  color-scheme:dark;
}
:root[data-theme="midnight"]{
  --bg:#0a0f2c; --surface:#111842; --surface2:#16204f; --key:#1a2459; --key2:#24306b;
  --text:#eef1ff; --muted:#9aa4d6; --line:#2a377a; --sh:#050820; --blob:24%; --alt:var(--acc);
  color-scheme:dark;
}
:root[data-theme="sepia"]{
  --bg:#efe6d2; --surface:#fbf6ea; --surface2:#f4ecdb; --key:#fffaf0; --key2:#e8dcc3;
  --text:#3a2e1f; --muted:#7a6a52; --line:#dccfb4; --sh:#cdbd9c; --blob:10%;
  --alt:color-mix(in srgb, var(--acc-d) 65%, #000);
  color-scheme:light;
}
:root{ --grad:linear-gradient(135deg,var(--pri) 0%,var(--sec) 100%); }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--text);display:flex;justify-content:center;
  font-family:system-ui,-apple-system,"Segoe UI","Noto Sans","Noto Sans Bengali","Noto Sans Arabic","Noto Sans Devanagari","Noto Sans SC",sans-serif;
  background-image:
    radial-gradient(520px 320px at -10% -5%, color-mix(in srgb, var(--pri) var(--blob), transparent), transparent 60%),
    radial-gradient(480px 320px at 110% 105%, color-mix(in srgb, var(--sec) var(--blob), transparent), transparent 60%);
  background-attachment:fixed;
  transition:background-color .3s,color .3s;
}
[hidden]{display:none!important}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer;user-select:none;-webkit-user-select:none;padding:0}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

.app{
  width:100%;max-width:440px;height:100vh;height:100dvh;
  padding:10px 12px max(12px,env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:10px;
}
.pane{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px}
.pane.scroll{overflow-y:auto;overscroll-behavior:contain;padding-bottom:6px}
.pane.scroll > *{flex-shrink:0}

/* ---------- হেডার ---------- */
.top{display:flex;align-items:center;justify-content:space-between;height:38px;flex:none}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.08rem;letter-spacing:.2px;direction:ltr}
.logo{
  position:relative;width:32px;height:32px;border-radius:10px;background:var(--grad);color:#fff;
  display:grid;place-items:center;font-size:.92rem;font-weight:900;box-shadow:inset 0 -3px 0 rgba(0,0,0,.22)
}
.logo::after{content:"";position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--acc);border:2px solid var(--bg)}
.brand b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.icon-btn{
  width:36px;height:36px;border-radius:11px;background:var(--surface);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--muted);transition:transform .25s,color .2s
}
.icon-btn:hover{color:var(--text)}
.icon-btn:active{transform:rotate(45deg) scale(.92)}
.icon-btn svg{width:20px;height:20px}

/* ---------- স্লাইডিং ট্যাব ---------- */
.slide{
  position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);flex:none;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:3px;height:40px
}
.slide.small{height:36px;border-radius:12px}
.slide button{position:relative;z-index:1;font-size:.9rem;font-weight:700;color:var(--muted);border-radius:11px;transition:color .2s;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.slide.small button{font-size:.8rem;border-radius:9px}
.slide button.on{color:#fff}
.slide .ind{
  position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/var(--n));border-radius:11px;
  background:var(--grad);transform:translateX(calc(var(--i,0)*100%));
  transition:transform .3s cubic-bezier(.3,.7,.2,1);box-shadow:0 4px 14px color-mix(in srgb,var(--pri) 35%,transparent)
}
.slide.small .ind{border-radius:9px;background:var(--pri)}
[dir="rtl"] .slide .ind{left:auto;right:3px;transform:translateX(calc(var(--i,0)*-100%))}

/* ---------- ক্যালকুলেটর ---------- */
.screen{
  flex:1;min-height:110px;position:relative;overflow:hidden;direction:ltr;
  background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:14px 16px 12px;
  display:flex;flex-direction:column;justify-content:space-between;gap:6px
}
.screen::before{
  content:"";position:absolute;left:0;right:0;top:0;height:4px;
  background:linear-gradient(90deg,var(--pri) 0 25%,var(--sec) 25% 50%,var(--acc) 50% 75%,var(--dan-l) 75%)
}
.screen-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{height:28px;padding:0 12px;border-radius:14px;font-size:.8rem;font-weight:800;background:var(--key2);color:var(--muted);transition:background .2s,color .2s;white-space:nowrap}
.pill.on{background:var(--grad);color:#fff}
.pill.mode{background:transparent;border:2px solid var(--pri);color:var(--pri-l);padding:0 10px}
.pill.mode.rad{border-color:var(--sec);color:var(--sec-l)}
.screen-bot{display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:0}
.hint{min-height:1.3em;font-size:clamp(.9rem,2.4vh,1.05rem);color:var(--muted);text-align:right;overflow-wrap:anywhere;max-width:100%}
.hint.prev{color:var(--sec-l);font-weight:600}
.out{font-size:clamp(2rem,5.6vh,3rem);font-weight:700;line-height:1.12;text-align:right;overflow-wrap:anywhere;max-width:100%;font-variant-numeric:tabular-nums}
.out.m{font-size:clamp(1.6rem,4.2vh,2.15rem)}.out.s{font-size:clamp(1.25rem,3.2vh,1.55rem)}
.out.err{font-size:clamp(1.3rem,3.6vh,1.7rem);color:var(--dan-l)}
.out.pop{animation:pop .28s ease-out}
@keyframes pop{0%{transform:scale(.9);opacity:.4}60%{transform:scale(1.04)}100%{transform:none;opacity:1}}

.sci{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;flex:none;direction:ltr}
.sk{position:relative;height:clamp(32px,4.8vh,40px);border-radius:12px;background:var(--key2);font-size:.92rem;font-weight:700;transition:transform .08s,background .2s}
.sk:active{transform:scale(.94)}
.sk .alt{position:absolute;top:1px;right:6px;font-size:.58rem;font-weight:800;color:var(--alt)}
.sci.shifted .sk[data-l2]{background:color-mix(in srgb,var(--acc) 22%,var(--key2))}
.sci.shifted .alt{visibility:hidden}
.sk.shiftkey{color:var(--alt)}
.sci.shifted .sk.shiftkey{background:var(--acc);color:var(--acc-ink)}

.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;flex:none;direction:ltr}
.k{height:clamp(48px,7.4vh,62px);border-radius:18px;background:var(--key);color:var(--text);font-size:1.45rem;font-weight:600;
  box-shadow:0 3px 0 var(--sh);transition:transform .08s,box-shadow .08s,filter .15s}
.k:hover{filter:brightness(1.05)}
.k:active{transform:translateY(3px) scale(.97);box-shadow:none}
.k.fn{background:var(--key2)}
.k.op{background:linear-gradient(160deg,var(--pri-l),var(--pri-d));color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--pri-d) 70%,#000);font-size:1.6rem}
.k.clr{background:linear-gradient(160deg,var(--dan-l),var(--dan));color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--dan) 65%,#000);font-weight:800}
.k.eq{background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 80%,#fff),var(--acc-d));color:var(--acc-ink);box-shadow:0 3px 0 color-mix(in srgb,var(--acc-d) 72%,#000);font-weight:900;font-size:1.75rem}
.span2{grid-column:span 2}

/* ---------- সাধারণ ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px}
input,select{
  font:inherit;font-size:1.05rem;height:46px;border-radius:12px;border:2px solid var(--line);
  background:var(--surface2);color:var(--text);padding:0 12px;min-width:0;transition:border-color .2s
}
input:focus,select:focus{outline:none;border-color:var(--pri)}
.lbl-s{font-size:.78rem;font-weight:700;color:var(--muted);letter-spacing:.3px;margin:0 0 6px}
.note{font-size:.82rem;color:var(--muted);margin:0;line-height:1.5}
.note.warn{color:var(--dan-l);font-weight:600}
.center{text-align:center}
.empty{text-align:center;color:var(--muted);padding:26px 10px;line-height:1.7;border:2px dashed var(--line);border-radius:18px}
.ltr{direction:ltr;unicode-bidi:isolate}

/* ---------- ইউনিট ---------- */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:17px;background:var(--surface);border:1px solid var(--line);
  font-size:.9rem;font-weight:700;color:var(--muted);transition:background .2s,color .2s}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.cv-src{border:2px solid var(--pri);box-shadow:0 6px 22px color-mix(in srgb,var(--pri) 18%,transparent)}
.cv-row{display:flex;gap:8px}
.cv-row input{flex:1.1;font-size:1.5rem;font-weight:800;height:54px;direction:ltr}
.cv-row select{flex:1;height:54px}
.cv-list{display:flex;flex-direction:column;gap:10px}
.cv-card{position:relative;padding:12px 12px 12px 20px;overflow:hidden}
[dir="rtl"] .cv-card{padding:12px 20px 12px 12px}
.cv-card::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:6px;background:var(--c)}
.cv-card:nth-child(1){--c:var(--pri)}
.cv-card:nth-child(2){--c:var(--sec)}
.cv-card:nth-child(3){--c:var(--acc)}
.cv-val{font-size:1.65rem;font-weight:800;word-break:break-all;cursor:copy;font-variant-numeric:tabular-nums;direction:ltr;text-align:start;unicode-bidi:plaintext}
.cv-foot{display:flex;gap:8px;margin-top:8px}
.cv-foot select{flex:1;height:40px;font-size:.95rem}
.mini{width:46px;height:40px;border-radius:12px;background:var(--key2);font-size:1.15rem;font-weight:800;flex:none}
.mini:active{transform:scale(.92)}

/* ---------- ঘড়ি ---------- */
.sub{display:flex;flex-direction:column;gap:12px}
.hero{border-radius:22px;padding:16px 18px;color:#fff;background:var(--grad);box-shadow:0 10px 30px color-mix(in srgb,var(--pri) 28%,transparent);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;z-index:0;inset-inline-end:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:color-mix(in srgb,var(--acc) 38%,transparent)}
.hero > *{position:relative;z-index:1}
.hero .big{position:relative;font-size:2.7rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.hero .big small{font-size:1rem;margin-inline-start:6px;font-weight:700;opacity:.9}
.hero .sm{position:relative;font-size:.92rem;opacity:.94;margin-top:2px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px}

.al-main{flex:1;text-align:start;display:flex;flex-direction:column;gap:2px;min-width:0}
.al-time{font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.al-time small{font-size:.9rem;margin-inline-start:5px;color:var(--muted)}
.al-meta{font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.off .al-time{color:var(--muted)}
.row.snz{border-color:var(--acc)}

.switch{position:relative;display:inline-block;width:50px;height:30px;flex:none;direction:ltr}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:15px;background:var(--key2);transition:background .2s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:transform .2s}
.switch input:checked + span{background:var(--sec)}
.switch input:checked + span::after{transform:translateX(20px)}
.switch input:focus-visible + span{outline:3px solid var(--acc);outline-offset:2px}

.ctrl{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.btn{height:52px;min-width:108px;border-radius:26px;padding:0 20px;font-weight:800;font-size:1.02rem;transition:transform .08s,filter .2s}
.btn:active{transform:scale(.95)}
.btn.go{background:linear-gradient(160deg,var(--sec-l),var(--sec));color:#fff;box-shadow:0 6px 18px color-mix(in srgb,var(--sec) 35%,transparent)}
.btn.stop{background:linear-gradient(160deg,var(--dan-l),var(--dan));color:#fff;box-shadow:0 6px 18px color-mix(in srgb,var(--dan) 35%,transparent)}
.btn.warn{background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 80%,#fff),var(--acc-d));color:var(--acc-ink);box-shadow:0 6px 18px color-mix(in srgb,var(--acc-d) 35%,transparent)}
.btn.blue{background:linear-gradient(160deg,var(--pri-l),var(--pri-d));color:#fff;box-shadow:0 6px 18px color-mix(in srgb,var(--pri) 35%,transparent)}
.btn.ghost{background:var(--key2);color:var(--text)}
.btn.wide{width:100%}

.ring-wrap{position:relative;width:min(64vw,230px);aspect-ratio:1;margin:4px auto 0}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-wrap .track{fill:none;stroke:var(--key2);stroke-width:12}
.ring-wrap .prog{fill:none;stroke:url(#tmg);stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .25s linear,stroke .3s}
.st1{stop-color:var(--pri)} .st2{stop-color:var(--sec-l)}
.ring-wrap.warn .prog{stroke:var(--acc)}
.ring-wrap.crit .prog{stroke:var(--dan-l)}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ring-c .t{font-size:2.5rem;font-weight:800;font-variant-numeric:tabular-nums;direction:ltr}
.ring-wrap.crit .ring-c .t{color:var(--dan-l)}
.ring-c .s{font-size:.85rem;color:var(--muted);text-align:center;padding:0 24px}
.hms{display:flex;justify-content:center;gap:10px;direction:ltr}
.hms label{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.78rem;color:var(--muted);font-weight:700}
.hms input{width:76px;height:54px;text-align:center;font-size:1.6rem;font-weight:800}
.presets{justify-content:center;flex-wrap:wrap}

.sw-disp{text-align:center;font-size:clamp(3rem,15vw,4.2rem);font-weight:800;font-variant-numeric:tabular-nums;padding:18px 0 6px;direction:ltr}
.sw-disp small{font-size:.5em;color:var(--muted)}
.sw-disp.running small{color:var(--sec-l)}
.laps{display:flex;flex-direction:column}
.lap{display:grid;grid-template-columns:1fr 1fr 1fr;padding:10px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;font-size:.98rem}
.lap span:nth-child(2),.lap span:nth-child(3){text-align:end}
.lap.head{font-size:.75rem;font-weight:800;color:var(--muted);padding-top:0}
.lap.fast{color:var(--sec-l);font-weight:700}
.lap.slow{color:var(--dan-l);font-weight:700}

.dn{width:14px;height:14px;border-radius:50%;flex:none}
.dn.day{background:var(--acc);box-shadow:0 0 10px color-mix(in srgb,var(--acc) 70%,transparent)}
.dn.night{box-shadow:inset -5px -2px 0 0 var(--pri-l)}
.wc-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.wc-info b{font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wc-info span{font-size:.8rem;color:var(--muted)}
.wc-time{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.wc-time small{font-size:.75rem;color:var(--muted);margin-inline-start:3px}
.x{width:30px;height:30px;border-radius:50%;background:var(--key2);color:var(--muted);font-size:1.1rem;flex:none}
.x:hover{background:var(--dan);color:#fff}

/* ---------- শিট ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:50;background:rgba(2,5,12,.6);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.sheet-wrap.open{opacity:1}
.sheet{width:100%;max-width:440px;max-height:90vh;overflow-y:auto;background:var(--surface);
  border-radius:24px 24px 0 0;padding:8px 16px max(18px,env(safe-area-inset-bottom));
  transform:translateY(40px);transition:transform .25s cubic-bezier(.3,.7,.2,1);border-top:4px solid var(--pri)}
.sheet-wrap.open .sheet{transform:none}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 8px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sheet-head h2{margin:0;font-size:1.15rem}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.set-row .l,.set-block .l{font-weight:700;font-size:.93rem}
.set-block{padding:11px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:9px}
.set-row select{height:38px;font-size:.92rem;max-width:58%}
.seg{display:inline-grid;grid-auto-flow:column;gap:2px;background:var(--key2);padding:3px;border-radius:12px}
.seg button{height:30px;padding:0 10px;border-radius:9px;font-size:.8rem;font-weight:700;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--pri);color:#fff}
input[type=range]{height:auto;padding:0;border:0;background:none;accent-color:var(--sec);width:150px}

/* থিম বাছাই */
.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.th{display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px;border-radius:14px;border:2px solid var(--line);font-size:.76rem;font-weight:700;color:var(--muted)}
.th.on{border-color:var(--pri);color:var(--text);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 25%,transparent)}
.th i{display:block;width:100%;height:38px;border-radius:9px;position:relative;overflow:hidden;border:1px solid rgba(128,128,128,.25)}
.th i::before{content:"";position:absolute;left:10%;right:10%;bottom:6px;height:12px;border-radius:5px;background:var(--pv-s)}
.th i::after{content:"";position:absolute;right:14%;top:7px;width:10px;height:10px;border-radius:50%;background:var(--pri)}
/* রঙের সেট বাছাই */
.pal-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pal{display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 2px;border-radius:14px;border:2px solid transparent;font-size:.68rem;font-weight:700;color:var(--muted);line-height:1.2;text-align:center}
.pal.on{border-color:var(--pri);color:var(--text)}
.pal i{width:40px;height:40px;border-radius:50%;box-shadow:0 3px 10px rgba(0,0,0,.25);transition:transform .2s}
.pal:hover i{transform:scale(1.08) rotate(20deg)}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field input,.field select{width:100%}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.days button{height:38px;border-radius:11px;background:var(--key2);font-size:.72rem;font-weight:700;color:var(--muted);overflow:hidden}
.days button.on{background:var(--sec);color:#fff}
.sheet .ctrl{margin-top:6px}
.zn-list{display:flex;flex-direction:column;margin-top:8px}
.zn{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:start;padding:11px 4px;border-bottom:1px solid var(--line)}
.zn b{display:block;font-size:.98rem}
.zn small{color:var(--muted);font-size:.76rem}
.zn .off{font-size:.82rem;font-weight:800;color:var(--pri-l);white-space:nowrap;direction:ltr}
.zn.added .off{color:var(--sec-l)}
#zn-q{width:100%;position:sticky;top:0}

/* ---------- বাজার স্ক্রিন ---------- */
.ringer{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  padding:24px;color:#fff;text-align:center;background:linear-gradient(160deg,color-mix(in srgb,var(--pri-d) 70%,#000),var(--pri) 45%,var(--sec))}
.rg-bell{position:relative;width:120px;height:120px;display:grid;place-items:center}
.rg-bell::before,.rg-bell::after{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid var(--acc);animation:wave 1.6s ease-out infinite}
.rg-bell::after{animation-delay:.8s}
@keyframes wave{from{transform:scale(.6);opacity:1}to{transform:scale(1.5);opacity:0}}
.rg-bell svg{width:64px;height:64px;animation:shake .5s ease-in-out infinite alternate}
@keyframes shake{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.rg-title{font-size:3rem;font-weight:900;font-variant-numeric:tabular-nums}
.rg-sub{font-size:1.1rem;opacity:.95;margin-bottom:14px}

.toast{position:fixed;left:50%;bottom:28px;z-index:70;transform:translate(-50%,20px);opacity:0;pointer-events:none;
  background:#0b1220;color:#fff;padding:10px 18px;border-radius:20px;font-size:.9rem;font-weight:600;
  border:1px solid rgba(255,255,255,.12);transition:opacity .2s,transform .2s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}


/* ---------- ব্র্যান্ড (Kz 3C) ---------- */
.bt{display:flex;flex-direction:column;line-height:1.08}
.bt small{font-size:.6rem;font-weight:700;color:var(--muted);letter-spacing:.2px}
#tabs button{font-size:.84rem}

/* ---------- ক্যালেন্ডার: ইংরেজি = প্রধান রং, হিজরি = দ্বিতীয়, বাংলা = হাইলাইট ---------- */
.c-g{color:color-mix(in srgb,var(--pri-l) 85%,var(--text))}
.c-h{color:color-mix(in srgb,var(--sec) 80%,var(--text))}
.c-b{color:var(--alt)}
.cal-hero{display:flex;flex-direction:column;gap:5px}
.cal-hero .wd{font-size:.9rem;opacity:.92;font-weight:700}
.cal-hero .gd{font-size:1.85rem;font-weight:800;line-height:1.12}
.cal-line{display:flex;align-items:center;gap:8px;font-size:1rem;font-weight:700}
.cal-line i{font-style:normal;font-size:.66rem;font-weight:800;padding:2px 8px;border-radius:9px;background:rgba(255,255,255,.24);white-space:nowrap}
.cal-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
#cal-prim button.on.cg{background:var(--pri);color:#fff}
#cal-prim button.on.ch{background:var(--sec);color:#fff}
#cal-prim button.on.cb{background:var(--acc-d);color:var(--acc-ink)}
.cal-nav{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cal-nav .mini{font-size:1.5rem;line-height:1}
[dir="rtl"] .cal-nav .mini{transform:scaleX(-1)}
.cal-title{flex:1;text-align:center;display:flex;flex-direction:column;min-width:0}
.cal-title b{font-size:1.12rem}
.cal-title small{font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-head div{text-align:center;font-size:.68rem;font-weight:800;color:var(--muted);padding:3px 0 5px;overflow:hidden;white-space:nowrap;text-overflow:clip}
.cal-head div.we{color:var(--dan-l)}
.cd{position:relative;height:clamp(46px,6.4vh,56px);border-radius:11px;background:var(--surface2);display:flex;align-items:flex-start;justify-content:center;padding-top:7px;border:2px solid transparent;transition:transform .1s,border-color .15s}
.cd:active{transform:scale(.93)}
.cd b{font-size:1.05rem;font-weight:800;line-height:1}
.cd .s{position:absolute;bottom:3px;font-size:.6rem;font-weight:800;line-height:1}
.cd .s1{left:5px}.cd .s2{right:5px}
[dir="rtl"] .cd .s1{left:auto;right:5px}[dir="rtl"] .cd .s2{right:auto;left:5px}
.cd .dots{position:absolute;top:3px;right:4px;display:flex;gap:2px}
[dir="rtl"] .cd .dots{right:auto;left:4px}
.cd .dots i{width:6px;height:6px;border-radius:50%}
.cd.we b{color:var(--dan-l)}
.cd.today{background:var(--grad);box-shadow:0 4px 12px color-mix(in srgb,var(--pri) 35%,transparent)}
.cd.today b,.cd.today .s{color:#fff}
.cd.sel{border-color:var(--acc)}
.cd.blank{visibility:hidden}
.dt-i{background:var(--sec)}.dt-n{background:var(--dan-l)}.dt-o{background:var(--acc)}
.cal-legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:.72rem;color:var(--muted);font-weight:700}
.cal-legend span{display:flex;align-items:center;gap:5px}
.cal-legend i{width:8px;height:8px;border-radius:50%}
.dd-head{font-weight:800;font-size:1.05rem;margin-bottom:6px}
.dd-head span{color:var(--muted);font-weight:700;font-size:.88rem}
.dd-line{display:flex;gap:8px;align-items:center;font-size:.95rem;padding:3px 0;font-weight:600}
.tg{font-size:.64rem;font-weight:800;padding:2px 8px;border-radius:9px;color:#fff;flex:none;min-width:52px;text-align:center}
.tg.g{background:var(--pri)}.tg.h{background:var(--sec)}.tg.b{background:var(--acc-d);color:var(--acc-ink)}
.dd-hol{margin-top:6px}
.hol-row{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);width:100%;text-align:start}
.hol-row:last-child{border-bottom:0}
.hol-row .dot{width:10px;height:10px;border-radius:50%;flex:none}
.hol-row .nm{flex:1;font-weight:700;font-size:.92rem}
.hol-row .when{font-size:.76rem;color:var(--muted);text-align:end;white-space:nowrap;line-height:1.35}
.wide-seg{display:grid;grid-template-columns:repeat(3,1fr);width:100%;margin-bottom:10px}
.cv-dmy{display:flex;gap:8px}
.cv-dmy label{display:flex;flex-direction:column;gap:4px;font-size:.74rem;font-weight:700;color:var(--muted)}
.cv-dmy input{width:70px;text-align:center;font-weight:800;direction:ltr;padding:0 4px}
.cv-dmy label:last-child input{width:86px}
.cv-dmy label.grow{flex:1;min-width:0}
.cv-dmy select{width:100%}
.cv-out{margin:12px 0;display:flex;flex-direction:column;gap:2px;min-height:60px}

/* ===================== 4C (v5) নতুন অংশের স্টাইল ===================== */
.st-l,.st-r{display:flex;gap:6px;align-items:center;min-width:0}
.pill.icon{width:28px;padding:0;display:grid;place-items:center}
.pill.icon svg{width:16px;height:16px}
.mem-ind{font-size:.68rem;font-weight:900;color:var(--acc-ink);background:var(--acc);border-radius:7px;padding:2px 6px}
.sk.mem{font-size:.8rem;color:var(--pri-l)}
.out{cursor:copy}
#subtabs button{font-size:.68rem;padding:0 1px;letter-spacing:-.2px}
#tabs button{padding:0 2px;letter-spacing:-.15px}
#cvtabs button{padding:0 2px}
.bt small{max-width:60vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-row{display:flex;flex-direction:column;align-items:flex-end;gap:2px;width:100%;padding:10px 4px;border-bottom:1px solid var(--line)}
.hist-row .he{font-size:.85rem;color:var(--muted)}
.hist-row .hr{font-size:1.3rem;font-weight:800}
.tl-head{display:flex;align-items:center;gap:8px}
#tl-back{font-size:1.3rem}
.tool-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding-bottom:6px}
.tool{display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;background:var(--surface2);border:1px solid var(--line);font-weight:700;font-size:.9rem;text-align:start}
.tool:active{transform:scale(.97)}
.tool i{font-style:normal;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:.72rem;flex:none;background:var(--pri)}
.tool:nth-child(4n+2) i{background:var(--sec)}
.tool:nth-child(4n+3) i{background:var(--acc-d);color:var(--acc-ink)}
.tool:nth-child(4n+4) i{background:var(--dan)}
.tool-form{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.tool-form .field{margin-bottom:10px}
.tool-form .field.wide{grid-column:1 / -1}
.tool-form input,.tool-form select{width:100%}
.tool-out{background:var(--surface2);border-radius:16px;padding:4px 14px;margin:2px 0 12px;border:2px solid var(--pri)}
.to-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.to-row:last-child{border:0}
.to-row b{font-size:1.05rem;cursor:copy;text-align:end}
.to-row.main b{font-size:1.45rem;color:var(--pri-l)}
.fx-val{font-size:1.65rem;font-weight:800;word-break:break-all;cursor:copy;font-variant-numeric:tabular-nums;direction:ltr;text-align:start;unicode-bidi:plaintext}
.fx-status{display:flex;justify-content:space-between;align-items:center;gap:10px}
.big-in{width:100%;font-size:1.5rem;font-weight:800;height:54px}
.nw-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.nw-opts label{display:flex;flex-direction:column;gap:4px;font-size:.74rem;font-weight:700;color:var(--muted);min-width:0}
.nw-opts select{width:100%}
.nw-out{font-size:1.12rem;font-weight:700;line-height:1.6;min-height:3.2em;margin-bottom:12px;word-break:break-word}
.nw-out.warn{color:var(--dan-l)}
.bf{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bf span{width:46px;font-weight:800;font-size:.8rem;color:var(--pri-l);flex:none;direction:ltr}
.bf input{flex:1;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;width:100%}
.pr-row{padding:10px 14px}
.pr-row .pr-n{flex:1;font-weight:800;font-size:1.02rem}
.pr-row .pr-t{font-size:1.35rem;font-weight:800;font-variant-numeric:tabular-nums}
.pr-row .pr-t small{font-size:.72rem;color:var(--muted);margin-inline-start:3px}
.pr-row.past{opacity:.55}
.pr-row.next{border-color:var(--sec);box-shadow:0 0 0 2px color-mix(in srgb,var(--sec) 35%,transparent)}
.bell{width:36px;height:36px;border-radius:50%;background:var(--key2);display:grid;place-items:center;color:var(--muted);flex:none}
.bell svg{width:18px;height:18px}
.bell.on{background:var(--sec);color:#fff}
.dial{position:relative;width:200px;height:200px;margin:6px auto;border-radius:50%;border:3px solid var(--line);direction:ltr;
  background:radial-gradient(circle,var(--surface2) 0 80%,transparent 81%),repeating-conic-gradient(from -1deg,var(--muted) 0 2deg,transparent 2deg 30deg),var(--surface2);
  transition:transform .3s ease-out}
.dial::after{content:"";position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--pri)}
.dial .nmark{position:absolute;top:5px;left:50%;transform:translateX(-50%);font-weight:900;font-size:.8rem;color:var(--dan-l)}
.needle{position:absolute;left:50%;top:10%;width:6px;height:40%;margin-left:-3px;transform-origin:50% 100%;transform:rotate(var(--q,0deg));
  background:linear-gradient(to top,transparent,var(--sec));border-radius:3px;transition:transform .4s}
.needle::before{content:"";position:absolute;top:-16px;left:50%;width:18px;height:18px;margin-left:-9px;background:#111;border-top:5px solid var(--acc);border-radius:3px}
.q-info{font-weight:700;margin:8px 0 10px}
.prt{width:100%;border-collapse:collapse;font-size:.74rem;font-variant-numeric:tabular-nums}
.prt th{font-size:.6rem;color:var(--muted);padding:4px 1px;font-weight:800;position:sticky;top:0;background:var(--surface)}
.prt td{text-align:center;padding:5px 1px;border-bottom:1px solid var(--line);white-space:nowrap}
.prt td small{color:var(--muted)}
.prt tr.today td{background:color-mix(in srgb,var(--pri) 20%,transparent);font-weight:800}
.dt-e{background:var(--pri-l)}
.ev-add{margin-top:10px;height:44px}
.dc-row{display:flex;gap:8px;margin-top:8px}
.dc-row label{flex:1;display:flex;flex-direction:column;gap:4px;font-size:.74rem;font-weight:700;color:var(--muted);min-width:0}
.dc-row input,.dc-row select{width:100%}
.wide-seg2{display:grid;grid-template-columns:1fr 1fr;width:100%}
.dd-line.big{font-size:1.15rem;font-weight:800}
.rg-math{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:12px}
.rg-math div{font-size:1.2rem;font-weight:800}
.rg-math input{width:150px;text-align:center;font-size:1.6rem;font-weight:800;background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.45)}
.data-btns{gap:8px;flex-wrap:nowrap}
.data-btns .btn{min-width:0;flex:1;height:44px;padding:0 8px;font-size:.84rem}
#sw-copy{align-self:center}

@media (max-height:700px){ .app{gap:8px;padding-top:8px} .pane{gap:8px} .screen{padding:10px 14px 8px;gap:2px;min-height:96px} .pill{height:24px} }
@media (max-height:600px){ .k{height:44px;font-size:1.3rem} .keys{gap:7px} .sk{height:28px;font-size:.85rem} .sci{gap:5px} }
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

}

/* ===================================================================
   ৫. ক্যালকুলেটরের হিসাব-যন্ত্র (eval ছাড়া)
   =================================================================== */
const toRad   = x => S.deg ? x * Math.PI / 180 : x;
const fromRad = x => S.deg ? x * 180 / Math.PI : x;
const snap    = v => Math.abs(v) < 1e-12 ? 0 : v;
const FN = {
  sin:  x => snap(Math.sin(toRad(x))),
  cos:  x => snap(Math.cos(toRad(x))),
  tan:  x => { const c = snap(Math.cos(toRad(x))); if (c === 0) throw 'undef'; return snap(Math.sin(toRad(x))) / c; },
  asin: x => fromRad(Math.asin(x)), acos: x => fromRad(Math.acos(x)), atan: x => fromRad(Math.atan(x)),
  log: Math.log10, ln: Math.log, abs: Math.abs, '√': Math.sqrt, '∛': Math.cbrt
};
function fact(n){
  if (n < 0 || n % 1 !== 0 || n > 170) throw 0;
  let r = 1; for (let k = 2; k <= n; k++) r *= k; return r;
}
let ans = 0;
function evaluate(src){
  src = src.replace(/-/g, '−').replace(/[+−×÷^(]+$/, '');
  if (!src) throw 0;
  const toks = [];
  const re = /(\d+\.?\d*|\.\d+|Ans|asin|acos|atan|sin|cos|tan|log|ln|abs|√|∛|π|e|[+−×÷^()!%])/y;
  let pos = 0, m;
  while (pos < src.length){
    re.lastIndex = pos; m = re.exec(src);
    if (!m) throw 0;
    toks.push(m[1]); pos = re.lastIndex;
  }
  let i = 0;
  const peek = () => toks[i], next = () => toks[i++];
  const startsValue = tk => /^[\d.(√∛πe]|^(Ans|asin|acos|atan|sin|cos|tan|log|ln|abs)$/.test(tk);
  function expr(){
    let v = term();
    while (peek() === '+' || peek() === '−'){
      const o = next(), s0 = i;
      let r = term();
      if (toks[i - 1] === '%' && !toks.slice(s0, i).some(tk => tk === '×' || tk === '÷' || tk === '(')) r = v * r;   // 50+10% = 55
      const s = (o === '+') ? v + r : v - r;
      v = Math.abs(s) < 1e-12 * Math.max(Math.abs(v), Math.abs(r)) ? 0 : s;
    }
    return v;
  }
  function term(){
    let v = unary();
    for (;;){
      const tk = peek();
      if (tk === '×' || tk === '÷'){
        next(); const r = unary();
        if (tk === '÷' && r === 0) throw 'div0';
        v = (tk === '×') ? v * r : v / r;
      }
      else if (tk !== undefined && startsValue(tk)) v *= unary();
      else break;
    }
    return v;
  }
  function unary(){
    if (peek() === '−'){ next(); return -unary(); }
    if (peek() === '+'){ next(); return unary(); }
    return power();
  }
  function power(){
    const b = post();
    if (peek() === '^'){ next(); return Math.pow(b, unary()); }
    return b;
  }
  function post(){
    let v = prim();
    while (peek() === '!' || peek() === '%') v = (next() === '!') ? fact(v) : v / 100;
    return v;
  }
  function prim(){
    const tk = next();
    if (tk === undefined) throw 0;
    if (/^[\d.]/.test(tk)) return parseFloat(tk);
    if (tk === 'π') return Math.PI;
    if (tk === 'e') return Math.E;
    if (tk === 'Ans') return ans;
    if (tk === '('){ const v = expr(); if (peek() === ')') next(); return v; }
    if (FN[tk]){
      let a;
      if (peek() === '('){ next(); a = expr(); if (peek() === ')') next(); }
      else a = unary();
      return FN[tk](a);
    }
    throw 0;
  }
  const v = expr();
  if (i < toks.length) throw 0;
  return v;
}
function clean(v){
  if (Object.is(v, -0)) v = 0;
  return String(parseFloat(v.toPrecision(12)))
    .replace(/e\+?(-?)(\d+)$/, (m, neg, d) => '×10^' + (neg ? '−' : '') + d)
    .replace(/^-/, '−');
}
const fmtDisplay = s => s.replace(/\d+(\.\d*)?/g, m => {
  const [a, b] = m.split('.');
  return a.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (b !== undefined ? '.' + b : '');
});

/* ===================================================================
   ৬. ক্যালকুলেটরের বাটন
   =================================================================== */
const BIN  = '+−×÷^';
const POST = ['^2', '^3', '!', '%'];
const endsValue = s => /[\d.)πe!%s]$/.test(s);
let buf = '0', hist = '', done = false, err = false, shift = false, popOut = false;
const out = $('out'), hint = $('hint');
out.addEventListener('animationend', () => out.classList.remove('pop'));

function clearAll(){ buf = '0'; hist = ''; done = false; err = false; }
function fail(key){ buf = key; err = true; hist = ''; done = false; }          // ভুলের key রাখি, ভাষা বদলালেও ঠিক দেখায়
function openParens(){ let o = 0; for (const c of buf){ if (c === '(') o++; else if (c === ')') o--; } return o; }

function add(s){
  if (err) clearAll();
  if (s === 'INV') return addInverse();
  if (done){
    if (!(BIN.includes(s) || POST.includes(s))) buf = '0';
    done = false; hist = '';
  }
  const L = buf.slice(-1);
  if (s === '.'){
    if (/\.\d*$/.test(buf)) return;
    if (/\d$/.test(buf)) { buf += '.'; return; }
    if (BIN.includes(L) || L === '(') buf += '0.';
    return;
  }
  if (s === ')'){ if (openParens() > 0 && endsValue(buf)) buf += ')'; return; }
  if (POST.includes(s)){ if (endsValue(buf)) buf += s; return; }
  if (s === '−'){
    if (buf === '0'){ buf = '−'; return; }
    if (L === '−') return;
    if (L === '+'){ buf = buf.slice(0, -1) + '−'; return; }
    buf += '−'; return;
  }
  if (BIN.includes(s)){
    const b = buf.replace(/[+−×÷^]+$/, '');
    if (!b || b.slice(-1) === '(') return;
    buf = b + s; return;
  }
  if (buf === '0') buf = '';
  else if (/^\d$/.test(s) && /(^|[^\d.])0$/.test(buf)) buf = buf.slice(0, -1);
  buf += s;
}
function addInverse(){
  if (done){ buf = '1÷(' + buf + ')'; done = false; hist = ''; return; }
  if (buf === '0'){ buf = '1÷('; return; }
  const m = buf.match(/(\d+\.?\d*|\.\d+|π|e|Ans)$/);
  if (m){
    const before = buf.slice(0, -m[0].length);
    if (before.slice(-1) === '^'){ buf = '1÷(' + buf + ')'; return; }
    buf = before + '1÷(' + m[0] + ')'; return;
  }
  const L = buf.slice(-1);
  if (BIN.includes(L) || L === '('){ buf += '1÷('; return; }
  buf = '1÷(' + buf + ')';
}
function back(){
  if (err || done){ clearAll(); return; }
  buf = buf.replace(/(asin\(|acos\(|atan\(|sin\(|cos\(|tan\(|log\(|ln\(|abs\(|√\(|∛\(|Ans|.)$/, '');
  if (buf === '') buf = '0';
}
function equals(){
  if (err || done || buf === '0') return;
  try {
    const v = evaluate(buf);
    if (!isFinite(v)){ fail(Number.isNaN(v) ? 'err_bad' : 'err_big'); return; }
    hist = buf.replace(/[+−×÷^(]+$/, '') + ' =';
    ans = v; buf = clean(v); done = true; popOut = true;
    pushHist(hist.slice(0, -2), buf);
  } catch (e) {
    fail(e === 'div0' ? 'err_div0' : e === 'undef' ? 'err_undef' : 'err_bad');
  }
}
function render(){
  out.textContent = err ? t(buf) : fmtDisplay(buf);
  const len = out.textContent.length;
  out.className = 'out' + (err ? ' err' : len > 24 ? ' s' : len > 13 ? ' m' : '');
  if (popOut){ void out.offsetWidth; out.classList.add('pop'); popOut = false; }
  let h = hist ? fmtDisplay(hist) : '', prev = false;
  if (!done && !err && /[^\d.]/.test(buf) && buf !== '−'){
    try { const v = evaluate(buf); if (isFinite(v)){ h = '= ' + fmtDisplay(clean(v)); prev = true; } } catch (e) {}
  }
  hint.textContent = h;
  hint.classList.toggle('prev', prev);
}

  if (/^\d$/.test(k)) add(k);

const fmtCache = {};
function timeStr(d, tz, sec){                    // { t: "7:30", ap: "AM"/"ص"/"上午" }
  const key = 'T|' + (tz || '') + '|' + (sec ? 1 : 0) + '|' + (S.h24 ? 1 : 0);
  let f = fmtCache[key];
  if (!f){
    const o = { hour: S.h24 ? '2-digit' : 'numeric', minute: '2-digit', hourCycle: S.h24 ? 'h23' : 'h12' };
    if (sec) o.second = '2-digit';
    if (tz) o.timeZone = tz;
    f = fmtCache[key] = new Intl.DateTimeFormat('en-US', o);
  }
  let s = '', ap = '';
  for (const p of f.formatToParts(d)){
    if (p.type === 'dayPeriod') ap = t('ampm')[/^p/i.test(p.value) ? 1 : 0];
    else s += p.value;
  }
  return { t: s.trim(), ap };
}
function cached(key, make){ return fmtCache[key] || (fmtCache[key] = make()); }
const dateStr = d => cached('D|' + S.lang, () => new Intl.DateTimeFormat(LOC(), { weekday:'long', day:'numeric', month:'long', year:'numeric' })).format(d);
function ymd(d, tz){

}
function dayNames(){                              // রবি..শনি, ভাষা অনুযায়ী
  const f = cached('W|' + S.lang, () => new Intl.DateTimeFormat(LOC(), { weekday:'short' }));

}

function durText(ms){

}

function nextFire(a, now){
  if (a.snoozeAt && a.snoozeAt > now.getTime()) return a.snoozeAt;
  if (!a.on) return null;
  const [h, m] = a.t.split(':').map(Number);
  for (let k = 0; k < 8; k++){
    const d = new Date(now); d.setDate(d.getDate() + k); d.setHours(h, m, 0, 0);
    if (d <= now) continue;
    if (a.days.length && !a.days.includes(d.getDay())) continue;
    return d.getTime();
  }
  return null;
}

const sw = Object.assign({ run: false, start: 0, acc: 0, laps: [] }, store.get('kz-sw', {}));
const saveSW = () => store.set('kz-sw', sw);
const swNow = () => sw.acc + (sw.run ? Date.now() - sw.start : 0);
function swFmt(ms){
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return { main: (h ? h + ':' + pad(m) : pad(m)) + ':' + pad(s % 60), cs: '.' + pad(Math.floor(ms / 10) % 100) };
}
function renderSW(){
  const ms = swNow(), f = swFmt(ms);
  $('sw-disp').innerHTML = f.main + '<small>' + f.cs + '</small>';
  $('sw-disp').classList.toggle('running', sw.run);
  const main = $('sw-main'), left = $('sw-left');
  main.textContent = t(sw.run ? 'stop' : ms > 0 ? 'resume' : 'start');
  main.className = 'btn ' + (sw.run ? 'stop' : 'go');
  left.textContent = t(sw.run ? 'lap' : 'reset');
  left.className = 'btn ' + (sw.run ? 'blue' : 'ghost');
  left.disabled = !sw.run && ms === 0;
}
function renderLaps(){
  const L = sw.laps;
  $('sw-copy').hidden = !L.length;
  if (!L.length){ $('sw-laps').innerHTML = ''; return; }
  const split = L.map((v, k) => v - (k ? L[k - 1] : 0));
  let fast = -1, slow = -1;
  if (split.length >= 2){ fast = split.indexOf(Math.min(...split)); slow = split.indexOf(Math.max(...split)); }
  let h = '<div class="lap head"><span>' + esc(t('lap')) + '</span><span>' + esc(t('lap_time')) + '</span><span>' + esc(t('total')) + '</span></div>';
  for (let k = L.length - 1; k >= 0; k--){
    const a = swFmt(split[k]), b = swFmt(L[k]);
    h += '<div class="lap' + (k === fast ? ' fast' : k === slow ? ' slow' : '') + '"><span>' + (k + 1) +
         (k === fast ? ' · ' + esc(t('fastest')) : k === slow ? ' · ' + esc(t('slowest')) : '') +
         '</span><span class="ltr">' + a.main + a.cs + '</span><span class="ltr">' + b.main + b.cs + '</span></div>';
  }
  $('sw-laps').innerHTML = h;
}
let swRaf = 0;
function swLoop(){
  if (sw.run && S.tab === 'clock' && S.sub === 'sw' && !document.hidden){ renderSW(); swRaf = requestAnimationFrame(swLoop); }
  else swRaf = 0;
}
const swKick = () => { if (!swRaf) swRaf = requestAnimationFrame(swLoop); };
$('sw-main').onclick = () => {
  if (sw.run){ sw.acc += Date.now() - sw.start; sw.run = false; }
  else { sw.start = Date.now(); sw.run = true; }
  saveSW(); renderSW(); swKick();
};
$('sw-left').onclick = () => {
  if (sw.run) sw.laps.push(swNow());
  else { sw.acc = 0; sw.laps = []; }

};

/* ===================================================================
   ১৩খ. ক্যালেন্ডার
   ইংরেজি = গ্রেগরিয়ান · হিজরি = উম্মুল কুরা (সৌদি সরকারি) ± সমন্বয়
   বাংলা = বঙ্গাব্দ, বাংলাদেশের সংশোধিত নিয়ম (২০১৯): ১৪ এপ্রিল পহেলা বৈশাখ,
           বৈশাখ–আশ্বিন ৩১ দিন, বাকি ৩০ দিন, ফাল্গুন ২৯ (অধিবর্ষে ৩০)
   প্রতিটা দিন রাখা হয় "দিন-সংখ্যা" (dn) হিসেবে: ১ জানুয়ারি ১৯৭০ থেকে কত দিন
   =================================================================== */
const DAY = 864e5;
const dnOf = (y, m, d) => Math.floor(Date.UTC(y, m - 1, d) / DAY);
const noon = dn => new Date(dn * DAY + DAY / 2);
function gParts(dn){ const d = new Date(dn * DAY); return { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate(), wd: d.getUTCDay() }; }
const todayDn = () => { const n = new Date(); return dnOf(n.getFullYear(), n.getMonth() + 1, n.getDate()); };

let HF;
function hijriFmt(){
  if (HF !== undefined) return HF;
  for (const c of ['islamic-umalqura', 'islamic-civil', 'islamic']){
    try {
      const f = new Intl.DateTimeFormat('en-u-ca-' + c + '-nu-latn', { timeZone:'UTC', day:'numeric', month:'numeric', year:'numeric' });
      if (f.resolvedOptions().calendar === c) return HF = f;
    } catch (e) {}
  }
  return HF = null;
}
const hCache = new Map();
function hParts(dn){
  const k = dn + (S.hadj || 0);
  let r = hCache.get(k);
  if (!r){
    const f = hijriFmt();
    if (!f) return { y: 0, m: 1, d: 1 };
    const p = {}; for (const x of f.formatToParts(noon(k))) p[x.type] = x.value;
    r = { y: parseInt(p.year, 10), m: parseInt(p.month, 10), d: parseInt(p.day, 10) };
    hCache.set(k, r);
  }
  return r;
}
const isLeap = y => (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
const bLens = by => [31, 31, 31, 31, 31, 31, 30, 30, 30, 30, isLeap(by + 594) ? 30 : 29, 30];
function bParts(dn){
  const g = gParts(dn);
  let by = g.y - 593;
  if (dn < dnOf(g.y, 4, 14)) by--;
  let off = dn - dnOf(by + 593, 4, 14), m = 0;
  const L = bLens(by);
  while (off >= L[m]){ off -= L[m]; m++; }
  return { y: by, m: m + 1, d: off + 1 };
}
function gToDn(y, m, d){
  if (!(y >= 100 && m >= 1 && m <= 12 && d >= 1)) return null;
  const dn = dnOf(y, m, d), p = gParts(dn);
  return p.y === y && p.m === m && p.d === d ? dn : null;
}
function hToDn(y, m, d){
  if (!(y >= 1 && m >= 1 && m <= 12 && d >= 1 && d <= 30)) return null;
  const est = dnOf(622, 7, 19) + Math.floor((y - 1) * 354.36667 + (m - 1) * 29.5306 + d - 1) - (S.hadj || 0);
  for (let k = 0; k <= 8; k++) for (const sft of (k ? [k, -k] : [0])){
    const p = hParts(est + sft);
    if (p.y === y && p.m === m && p.d === d) return est + sft;
  }
  return null;
}
function bToDn(y, m, d){
  if (!(y >= 1 && m >= 1 && m <= 12)) return null;
  const L = bLens(y);
  if (d < 1 || d > L[m - 1]) return null;
  let dn = dnOf(y + 593, 4, 14);
  for (let k = 0; k < m - 1; k++) dn += L[k];
  return dn + d - 1;
}
const PARTS = { g: gParts, h: hParts, b: bParts };
const TODN  = { g: gToDn,  h: hToDn,  b: bToDn };

function monthName(cal, p){
  if (cal === 'g') return cached('GM|' + S.lang, () => new Intl.DateTimeFormat(LOC(), { month:'long', timeZone:'UTC' })).format(new Date(Date.UTC(2024, p.m - 1, 15, 12)));
  return t(cal === 'h' ? 'hm' : 'bm')[p.m - 1];
}
function fmtCal(cal, dn){
  if (cal === 'g') return cached('GF|' + S.lang, () => new Intl.DateTimeFormat(LOC(), { day:'numeric', month:'long', year:'numeric', timeZone:'UTC' })).format(noon(dn));
  const p = PARTS[cal](dn);
  return p.d + ' ' + monthName(cal, p) + ' ' + p.y;
}
const wdLong  = dn => cached('WL|' + S.lang, () => new Intl.DateTimeFormat(LOC(), { weekday:'long', timeZone:'UTC' })).format(noon(dn));
const fmtShort = dn => cached('GS|' + S.lang, () => new Intl.DateTimeFormat(LOC(), { day:'numeric', month:'short', timeZone:'UTC' })).format(noon(dn));
function relDay(diff){
  return diff === 0 ? t('today') : diff === 1 ? t('tomorrow') : diff === -1 ? t('yesterday')
       : diff > 0 ? t('in_days', { n: diff }) : t('ago_days', { n: -diff });

function holidaysOn(dn){
  if (S.hol === 'off') return [];
  const want = S.hol === 'bd' ? 'b' : S.hol === 'sa' ? 's' : '';
  const P = { g: gParts(dn), h: hParts(dn), b: bParts(dn) };
  return HOL.filter(h => (!want || h.r.includes(want)) && P[h.c].m === h.m && P[h.c].d === h.d);
}
const holName = h => h.n[S.lang] || h.n.en;

/* মাসের প্রথম ও শেষ দিন (যেকোনো ক্যালেন্ডারে) */
function monthBounds(dn){
  const P = PARTS[S.cal];
  const s = dn - (P(dn).d - 1);
  let e = s + 27;
  while (P(e + 1).d !== 1) e++;
  return { s, e };
}
function spanText(c, s, e){
  const a = PARTS[c](s), b = PARTS[c](e);
  if (a.y !== b.y) return monthName(c, a) + ' ' + a.y + ' – ' + monthName(c, b) + ' ' + b.y;
  return monthName(c, a) + (a.m !== b.m ? ' – ' + monthName(c, b) : '') + ' ' + b.y;
}

let calView = null, calSel = null;
function renderCalToday(){
  const dn = todayDn();
  $('cal-today').innerHTML = '<div class="wd">' + esc(wdLong(dn)) + '</div><div class="gd">' + esc(fmtCal('g', dn)) + '</div>' +
    '<div class="cal-line"><i>' + esc(t('cal_h')) + '</i>' + esc(fmtCal('h', dn)) + '</div>' +
    '<div class="cal-line"><i>' + esc(t('cal_b')) + '</i>' + esc(fmtCal('b', dn)) + '</div>';
}
function renderCal(){
  const tdn = todayDn();
  if (calView == null) calView = tdn;
  if (calSel == null) calSel = tdn;
  if (!PARTS[S.cal]) S.cal = 'g';
  const cal = S.cal, P = PARTS[cal], { s, e } = monthBounds(calView), ps = P(s);
  const others = ['g', 'h', 'b'].filter(c => c !== cal);
  $('cal-title').textContent = cal === 'g'
    ? cached('MY|' + S.lang, () => new Intl.DateTimeFormat(LOC(), { month:'long', year:'numeric', timeZone:'UTC' })).format(noon(s))
    : monthName(cal, ps) + ' ' + ps.y;
  $('cal-sub').textContent = others.map(c => spanText(c, s, e)).join(' · ');
  const N = dayNames(), wk = S.wk || 0, we = weekend();
  let head = '';
  for (let i = 0; i < 7; i++){ const wd = (wk + i) % 7; head += '<div class="' + (we.includes(wd) ? 'we' : '') + '">' + esc(N[wd]) + '</div>'; }
  $('cal-head').innerHTML = head;
  let h = '';
  const lead = (gParts(s).wd - wk + 7) % 7;
  for (let i = 0; i < lead; i++) h += '<span class="cd blank"></span>';
  for (let dn = s; dn <= e; dn++){
    const wd = gParts(dn).wd, hs = holidaysOn(dn), evs = eventsOn(dn);
    const red = we.includes(wd) || hs.some(x => x.k !== 'o');
    h += '<button class="cd' + (dn === tdn ? ' today' : '') + (dn === calSel ? ' sel' : '') + (red ? ' we' : '') + '" data-dn="' + dn + '"><b>' + P(dn).d + '</b>' +
      ((hs.length || evs.length) ? '<span class="dots">' + (evs.length ? '<i class="dt-e"></i>' : '') + hs.slice(0, evs.length ? 2 : 3).map(x => '<i class="dt-' + x.k + '"></i>').join('') + '</span>' : '') +
      '<span class="s s1 c-' + others[0] + '">' + PARTS[others[0]](dn).d + '</span>' +
      '<span class="s s2 c-' + others[1] + '">' + PARTS[others[1]](dn).d + '</span></button>';
  }
  $('cal-grid').innerHTML = h;
  $$('#cal-prim button').forEach(b => b.classList.toggle('on', b.dataset.c === cal));
  $('cal-legend').innerHTML = others.map(c => '<span><b class="c-' + c + '">12</b>' + esc(t('cal_' + c)) + '</span>').join('') +
    (events.length ? '<span><i class="dt-e"></i>' + esc(t('lg_event')) + '</span>' : '') + (S.hol === 'off' ? '' : [['i', 'lg_islamic'], ['n', 'lg_national'], ['o', 'lg_other']].map(([k, l]) => '<span><i class="dt-' + k + '"></i>' + esc(t(l)) + '</span>').join(''));
  renderDay();
}
function renderDay(){
  const dn = calSel, hs = holidaysOn(dn), evs = eventsOn(dn);
  $('cal-day').innerHTML = '<div class="dd-head">' + esc(wdLong(dn)) + ' <span>· ' + esc(relDay(dn - todayDn())) + '</span></div>' +
    ['g', 'h', 'b'].map(c => '<div class="dd-line"><span class="tg ' + c + '">' + esc(t('cal_' + c)) + '</span>' + esc(fmtCal(c, dn)) + '</div>').join('') +
    '<div class="dd-hol">' + ((hs.length || evs.length)
      ? evs.map(e => '<button class="hol-row" data-ev="' + e.id + '"><span class="dot dt-e"></span><span class="nm">' + esc(e.title) + '</span><span class="when">' + (e.time ? esc(fmtHM(e.time)) : '') + '</span></button>').join('') +
        hs.map(x => '<div class="hol-row"><span class="dot dt-' + x.k + '"></span><span class="nm">' + esc(holName(x)) + '</span></div>').join('')

}
function renderUpcoming(){
  const tdn = todayDn(), list = [];
  for (let dn = tdn; dn < tdn + 400 && list.length < 8; dn++){
    for (const e of eventsOn(dn)) if (list.length < 8) list.push([dn, 'e', e.title]);
    for (const h of holidaysOn(dn)) if (list.length < 8) list.push([dn, h.k, holName(h)]);
  }
  $('cal-up').innerHTML = list.length ? list.map(([dn, k, name]) =>
    '<button class="hol-row" data-dn="' + dn + '"><span class="dot dt-' + k + '"></span><span class="nm">' + esc(name) + '</span>' +
    '<span class="when">' + esc(fmtShort(dn)) + '<br>' + esc(relDay(dn - tdn)) + '</span></button>').join('')
    : '<p class="note">' + esc(t('nothing_day')) + '</p>';

function jumpTo(dn){

(() => {                                         // আঙুল দিয়ে টানলে আগের/পরের মাস
  let x0 = null;
  const g = $('cal-grid');
  g.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });

function insertValue(v){                         // একটা সংখ্যা হিসাবের ভেতরে বসানো
  if (err) clearAll();

}

/* ---------- ১৭খ. টুলস (৮টা ছোট ক্যালকুলেটর) ---------- */
const nf = x => isFinite(x) ? x.toLocaleString('en-US', { maximumFractionDigits: 2 }).replace(/^-/, '−') : '—';
const TOOL_ICON = { pct:'%', disc:'−%', tip:'÷', loan:'EMI', vat:'VAT', zakat:'2.5%', bmi:'BMI', ci:'↗' };
const TOOLS = {
  pct:  { f: [['a', 'f_a', 15], ['b', 'f_b', 200]],
          run: v => [[t('o_pct_of', { a: nf(v.a), b: nf(v.b) }), nf(v.a * v.b / 100)],
                     [t('o_is_pct', { a: nf(v.a), b: nf(v.b) }), v.b ? nf(v.a / v.b * 100) + '%' : '—'],
                     [t('o_change', { a: nf(v.a), b: nf(v.b) }), v.a ? (v.b >= v.a ? '+' : '−') + nf(Math.abs((v.b - v.a) / v.a * 100)) + '%' : '—']] },
  disc: { f: [['p', 'f_price', 1000], ['d', 'f_disc', 20], ['x', 'f_tax', 0]],
          run: v => [[t('o_pay'), nf(v.p * (1 - v.d / 100) * (1 + v.x / 100))], [t('o_save'), nf(v.p * v.d / 100)]] },
  tip:  { f: [['b', 'f_bill', 250], ['t', 'f_tip', 10], ['n', 'f_people', 4]],
          run: v => { const tip = v.b * v.t / 100, tot = v.b + tip, n = Math.max(1, Math.round(v.n));
                      return [[t('o_each'), nf(tot / n)], [t('o_tip'), nf(tip)], [t('o_total'), nf(tot)]]; } },
  loan: { f: [['p', 'f_amount', 500000], ['r', 'f_rate', 9], ['y', 'f_years', 5]],
          run: v => { const n = Math.round(v.y * 12), r = v.r / 1200; if (n <= 0) return [];
                      const emi = r ? v.p * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1) : v.p / n;
                      return [[t('o_emi'), nf(emi)], [t('o_int'), nf(emi * n - v.p)], [t('o_totpay'), nf(emi * n)]]; } },
  vat:  { f: [['a', 'f_price', 1000], ['r', 'f_vat', 15]], sel: ['m', 'f_mode', [['add', 'vat_add'], ['rem', 'vat_rem']]],
          run: v => { const net = v.m === 'rem' ? v.a / (1 + v.r / 100) : v.a, vat = net * v.r / 100;
                      return [[t('o_gross'), nf(net + vat)], [t('o_net'), nf(net)], [t('o_vat'), nf(vat)]]; } },
  zakat:{ f: [['c', 'f_cash', 0], ['g', 'f_gold', 0], ['s', 'f_stock', 0], ['o', 'f_owed', 0], ['d', 'f_debt', 0], ['n', 'f_nisab', 0]], hint: 'zk_hint',
          run: v => { const base = Math.max(0, v.c + v.g + v.s + v.o - v.d), below = v.n > 0 && base < v.n;
                      return [[t('o_zakat'), below ? t('o_below') : nf(base * 0.025)], [t('o_zbase'), nf(base)]]; } },
  bmi:  { f: [['h', 'f_h', 170], ['w', 'f_w', 70]],
          run: v => { if (!(v.h > 0)) return []; const b = v.w / Math.pow(v.h / 100, 2);
                      return [[t('o_bmi'), b.toFixed(1)], [t('o_cat'), t(b < 18.5 ? 'bmi_u' : b < 25 ? 'bmi_n' : b < 30 ? 'bmi_o' : 'bmi_ob')]]; } },
  ci:   { f: [['p', 'f_p', 10000], ['m', 'f_monthly', 1000], ['r', 'f_rate', 6], ['y', 'f_years', 10]],
          run: v => { const n = Math.round(v.y * 12), r = v.r / 1200; let bal = v.p;
                      for (let k = 0; k < n; k++) bal = bal * (1 + r) + v.m;
                      const dep = v.p + v.m * n; return [[t('o_final'), nf(bal)], [t('o_dep'), nf(dep)], [t('o_earn'), nf(bal - dep)]]; } }
};
const TOOL_ORDER = ['pct', 'disc', 'tip', 'loan', 'vat', 'zakat', 'bmi', 'ci'];
let toolVals = store.get('kz-tools', {}), curTool = null;
function openTools(){ curTool = null; renderTools(); openSheet('sh-tools'); }
function renderTools(){
  $('tl-back').hidden = !curTool;
  if (!curTool){
    $('tl-h').textContent = t('tl_title');
    $('tl-body').innerHTML = '<div class="tool-grid">' + TOOL_ORDER.map(k =>

  }
  const T = TOOLS[curTool], vals = {};

/* ---------- ১৭ঙ. সংখ্যা কথায় (ইংরেজি মিলিয়ন / লাখ-কোটি, বাংলা) ---------- */

const EN_TENS = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
const en99  = n => n < 20 ? EN_ONES[n] : EN_TENS[Math.floor(n / 10)] + (n % 10 ? '-' + EN_ONES[n % 10] : '');
const en999 = n => [Math.floor(n / 100) ? EN_ONES[Math.floor(n / 100)] + ' Hundred' : '', n % 100 ? en99(n % 100) : ''].filter(Boolean).join(' ');
function enWords(n, ind){
  if (n === 0) return 'Zero';
  const parts = [];
  if (ind){
    const cr = Math.floor(n / 1e7); n %= 1e7;
    if (cr) parts.push((cr > 999 ? enWords(cr, true) : en999(cr)) + ' Crore');
    const lk = Math.floor(n / 1e5); n %= 1e5; if (lk) parts.push(en99(lk) + ' Lakh');
    const th = Math.floor(n / 1e3); n %= 1e3; if (th) parts.push(en99(th) + ' Thousand');
  } else {
    for (const [v, w] of [[1e12, 'Trillion'], [1e9, 'Billion'], [1e6, 'Million'], [1e3, 'Thousand']]){
      const q = Math.floor(n / v); if (q){ parts.push(en999(q) + ' ' + w); n -= q * v; }
    }

  if (n) parts.push(en999(n));
  return parts.join(' ');
}
const BN_W = ('শূন্য এক দুই তিন চার পাঁচ ছয় সাত আট নয় দশ এগারো বারো তেরো চৌদ্দ পনেরো ষোলো সতেরো আঠারো উনিশ ' +
  'বিশ একুশ বাইশ তেইশ চব্বিশ পঁচিশ ছাব্বিশ সাতাশ আটাশ ঊনত্রিশ ত্রিশ একত্রিশ বত্রিশ তেত্রিশ চৌত্রিশ পঁয়ত্রিশ ছত্রিশ সাঁইত্রিশ আটত্রিশ ঊনচল্লিশ ' +
  'চল্লিশ একচল্লিশ বিয়াল্লিশ তেতাল্লিশ চুয়াল্লিশ পঁয়তাল্লিশ ছেচল্লিশ সাতচল্লিশ আটচল্লিশ ঊনপঞ্চাশ পঞ্চাশ একান্ন বাহান্ন তিপ্পান্ন চুয়ান্ন পঞ্চান্ন ছাপ্পান্ন সাতান্ন আটান্ন ঊনষাট ' +
  'ষাট একষট্টি বাষট্টি তেষট্টি চৌষট্টি পঁয়ষট্টি ছেষট্টি সাতষট্টি আটষট্টি ঊনসত্তর সত্তর একাত্তর বাহাত্তর তিয়াত্তর চুয়াত্তর পঁচাত্তর ছিয়াত্তর সাতাত্তর আটাত্তর ঊনআশি ' +

const bn999 = n => [Math.floor(n / 100) ? BN_W[Math.floor(n / 100)] + ' শত' : '', n % 100 ? BN_W[n % 100] : ''].filter(Boolean).join(' ');
function bnWords(n){
  if (n === 0) return BN_W[0];
  const parts = [];

  const lk = Math.floor(n / 1e5); n %= 1e5; if (lk) parts.push(BN_W[lk] + ' লক্ষ');
  const th = Math.floor(n / 1e3); n %= 1e3; if (th) parts.push(BN_W[th] + ' হাজার');
  if (n) parts.push(bn999(n));
  return parts.join(' ');
}
const NW_CUR = {
  BDT: { en: ['Taka', 'Taka', 'Paisa', 'Paisa'], bn: ['টাকা', 'পয়সা'] },
  SAR: { en: ['Saudi Riyal', 'Saudi Riyals', 'Halala', 'Halalas'], bn: ['রিয়াল', 'হালালা'] },
  USD: { en: ['US Dollar', 'US Dollars', 'Cent', 'Cents'], bn: ['ডলার', 'সেন্ট'] },
  INR: { en: ['Rupee', 'Rupees', 'Paisa', 'Paise'], bn: ['রুপি', 'পয়সা'] },
  AED: { en: ['UAE Dirham', 'UAE Dirhams', 'Fils', 'Fils'], bn: ['দিরহাম', 'ফিলস'] }

function numToWords(raw, style, cur){
  raw = String(raw).replace(/[,\s]/g, '');
  if (!/^\d*\.?\d*$/.test(raw) || !/\d/.test(raw)) return { err: t('nw_bad') };
  const [ip, fp = ''] = raw.split('.');
  let n = parseInt(ip || '0', 10);
  if (n >= 1e15) return { err: t('nw_big') };
  const bn = style === 'bn', W = x => bn ? bnWords(x) : enWords(x, style === 'ind');
  if (cur === 'none'){
    let s = W(n);
    if (fp) s += (bn ? ' দশমিক ' : ' Point ') + [...fp].map(d => bn ? BN_W[+d] : (d === '0' ? 'Zero' : EN_ONES[+d])).join(' ');
    return { s };
  }
  let sub = Math.round(parseFloat('0.' + (fp || '0')) * 100);
  if (sub === 100){ n++; sub = 0; }
  const C = NW_CUR[cur], parts = [];
  if (bn){
    if (n) parts.push(W(n) + ' ' + C.bn[0]);
    if (sub) parts.push(W(sub) + ' ' + C.bn[1]);
    return { s: (parts.length ? parts.join(' ') : BN_W[0] + ' ' + C.bn[0]) + ' মাত্র' };
  }
  if (n) parts.push(W(n) + ' ' + (n === 1 ? C.en[0] : C.en[1]));
  if (sub) parts.push(W(sub) + ' ' + (sub === 1 ? C.en[2] : C.en[3]));
  return { s: (parts.length ? parts.join(' and ') : 'Zero ' + C.en[1]) + ' Only' };
}

const BASE_RE = { 10: /^[0-9]+$/, 16: /^[0-9a-f]+$/i, 8: /^[0-7]+$/, 2: /^[01]+$/ };
function baseFrom(b){
  const v = $('b-' + b).value.trim().replace(/[\s_]/g, '');
  $('b-err').textContent = '';
  if (!v){ [10, 16, 8, 2].forEach(x => { if (x !== b) $('b-' + x).value = ''; }); return; }
  let n = null;
  try { if (BASE_RE[b].test(v)) n = b === 10 ? BigInt(v) : BigInt((b === 16 ? '0x' : b === 8 ? '0o' : '0b') + v); } catch (e) {}
  if (n === null){ $('b-err').textContent = t('b_err'); return; }
  [10, 16, 8, 2].forEach(x => { if (x !== b) $('b-' + x).value = x === 16 ? n.toString(16).toUpperCase() : n.toString(x); });
}
[10, 16, 8, 2].forEach(b => $('b-' + b).addEventListener('input', () => baseFrom(b)));
const ROM = [[1000, 'M'], [900, 'CM'], [500, 'D'], [400, 'CD'], [100, 'C'], [90, 'XC'], [50, 'L'], [40, 'XL'], [10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']];
const toRoman = n => ROM.reduce((s, [v, r]) => { while (n >= v){ s += r; n -= v; } return s; }, '');
function fromRoman(s){
  s = s.toUpperCase();
  if (!/^[MDCLXVI]+$/.test(s)) return null;
  let n = 0, i = 0;
  for (const [v, r] of ROM) while (s.startsWith(r, i)){ n += v; i += r.length; }
  return i === s.length && toRoman(n) === s ? n : null;
}

  $('r-rom').value = toRoman(n);
});

  try { Object.keys(localStorage).filter(k => k.startsWith('kz-')).forEach(k => localStorage.removeItem(k)); } catch (e) {}
  location.reload();
};

/* ---------- ১৭ঠ. ভাষা বদলালে নতুন অংশগুলো আবার লেখা ---------- */
function v5Lang(){
  syncMem();
  if (!$('sh-hist').hidden) renderHist();
  if (!$('sh-tools').hidden) renderTools();
  $('cvtabs').style.setProperty('--i', CVSUBS.indexOf(S.cvsub || 'units'));
  fxOptions(); fxRun();
  nwOptions(); nwRun();
  buildEvRep(); dcInit();
  buildPrSelects(); renderPrayer();
  $('sw-copy').hidden = !sw.laps.length;
}

/* ===================================================================
   ১৪. শিট + সেটিংস
   =================================================================== */
function openSheet(id){ const w = $(id); w.hidden = false; requestAnimationFrame(() => w.classList.add('open')); }
function closeSheet(id){ const w = $(id); w.classList.remove('open'); setTimeout(() => { if (!w.classList.contains('open')) w.hidden = true; }, 220); }
$$('.sheet-wrap').forEach(w => w.addEventListener('click', e => {
  if (e.target === w || e.target.closest('[data-close]')) closeSheet(w.id);
}));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') $$('.sheet-wrap').forEach(w => { if (!w.hidden) closeSheet(w.id); });
});

$('set-lang').innerHTML = Object.keys(I18N).map(k => '<option value="' + k + '">' + I18N[k].name + '</option>').join('');
function buildPickers(){
  $('theme-grid').innerHTML = Object.keys(THEMES).map(k => {
    const [bg, sf] = THEMES[k];
    const prev = k === 'auto' ? 'linear-gradient(135deg,' + bg + ' 50%,' + sf + ' 50%)' : bg;
    return '<button class="th" data-theme="' + k + '"><i style="background:' + prev + ';--pv-s:' + (k === 'auto' ? '#7f8aa3' : sf) + '"></i>' + esc(t('th_' + k)) + '</button>';
  }).join('');
  $('pal-grid').innerHTML = Object.keys(PALS).map(k => {
    const c = PALS[k];
    return '<button class="pal" data-pal="' + k + '"><i style="background:conic-gradient(' + c[0] + ' 0 25%,' + c[1] + ' 0 50%,' + c[2] + ' 0 75%,' + c[3] + ' 0)"></i>' + esc(t('pal_' + k)) + '</button>';
  }).join('');
}
function syncSettings(){
  $('set-lang').value = S.lang;
  $$('#theme-grid .th').forEach(b => b.classList.toggle('on', b.dataset.theme === S.theme));
  $$('#pal-grid .pal').forEach(b => b.classList.toggle('on', b.dataset.pal === S.pal));
  $$('[data-set]').forEach(b => b.classList.toggle('on', String(S[b.dataset.set]) === b.dataset.v));
  $('set-vol').value = S.vol; $('set-vib').checked = S.vib; $('set-hap').checked = S.haptic;
  $('set-hol').value = S.hol;
  syncNotif();
}
$('open-set').onclick = () => { syncSettings(); openSheet('sh-set'); };
$('set-lang').addEventListener('change', e => { S.lang = e.target.value; saveS(); applyLang(); });
$('sh-set').addEventListener('click', e => {
  const th = e.target.closest('.th'), pl = e.target.closest('.pal'), b = e.target.closest('[data-set]');
  if (th){ S.theme = th.dataset.theme; saveS(); applyTheme(); syncSettings(); return; }
  if (pl){ S.pal = pl.dataset.pal; saveS(); applyTheme(); syncSettings(); return; }
  if (!b) return;
  const k = b.dataset.set, v = b.dataset.v;
  S[k] = v === 'true' ? true : v === 'false' ? false : /^-?\d+$/.test(v) ? +v : v;
  saveS(); syncSettings();
  if (k === 'deg'){ syncMode(); render(); }
  if (k === 'h24'){ for (const key in fmtCache) if (key[0] === 'T') delete fmtCache[key]; renderAlarms(); tick(true); }
  if (k === 'sound') SOUNDS[S.sound]();
  if (k === 'wk' || k === 'hadj') renderCalAll();
});
$('set-vol').addEventListener('change', e => { S.vol = +e.target.value; saveS(); SOUNDS[S.sound](); });
$('set-vib').addEventListener('change', e => { S.vib = e.target.checked; saveS(); if (S.vib) buzz(200); });
$('set-hap').addEventListener('change', e => { S.haptic = e.target.checked; saveS(); if (S.haptic) buzz(15); });
$('set-notif').onclick = askNotify;
$('set-hol').addEventListener('change', e => { S.hol = e.target.value; saveS(); renderCalAll(); });

/* ===================================================================
   ১৫. ভাষা প্রয়োগ (সব লেখা নতুন করে বসায়)
   =================================================================== */
function applyLang(){
  if (!I18N[S.lang]) S.lang = 'en';
  const L = I18N[S.lang], h = document.documentElement;
  h.lang = S.lang; h.dir = L.dir;
  $$('[data-t]').forEach(el => el.textContent = t(el.dataset.t));
  $$('[data-t-ph]').forEach(el => el.placeholder = t(el.dataset.tPh));
  $$('[data-t-title]').forEach(el => el.title = t(el.dataset.tTitle));
  $$('[data-t-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.tAria)));
  buildChips(); fillUnitOptions(true); convert();
  buildDays(); buildSnooze(); buildPresets(); buildPickers(); syncSettings();
  render(); renderTimer(); renderSW(); renderLaps(); renderAlarms(); renderWorldList();
  const now = new Date(); updateAlarmHero(now); updateWorld(now);
  if (!$('sh-alarm').hidden) $('al-title').textContent = t(editId ? 'al_t_edit' : 'al_t_new');
  if (!$('sh-zone').hidden) renderZoneList();
  const N = dayNames();
  $('set-week').innerHTML = [6, 0, 1].map(d => '<button data-set="wk" data-v="' + d + '">' + esc(N[d]) + '</button>').join('');
  $('set-hol').innerHTML = ['bd', 'sa', 'both', 'off'].map(k => '<option value="' + k + '">' + esc(t('hol_' + k)) + '</option>').join('');
  syncSettings();
  cvMonths(); renderCalAll();
  v5Lang();
}

/* ===================================================================
   ১৬. প্রতি সেকেন্ডের কাজ + শুরু
   =================================================================== */
let lastSec = -1, lastMin = -1, lastDay = -1;
function tick(force){
  const now = new Date();
  checkAlarms(now);
  checkTimer();
  if (S.tab === 'clock' && S.sub === 'timer' && tm.st === 'run') renderTimer();
  if (force || now.getSeconds() !== lastSec){
    lastSec = now.getSeconds();
    if (S.tab === 'clock' && S.sub === 'world') updateWorld(now);
    if (S.tab === 'clock' && S.sub === 'alarm') updateAlarmHero(now);
    if (S.tab === 'clock' && S.sub === 'prayer') prHero(now);
  }
  if (force || now.getMinutes() !== lastMin){
    lastMin = now.getMinutes(); renderAlarms();
    prCheck(now); evCheck(now);
    if (S.tab === 'clock' && S.sub === 'prayer') renderPrayer();
    const td = todayDn(); if (td !== lastDay){ lastDay = td; renderCalAll(); }
  }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden){ tick(true); swKick(); } });

if (!U[cat]) cat = 'length';
syncSci(); syncMode(); fillInputs();
applyLang();
showTab(S.tab);
tick(true);
setInterval(tick, 250);
</script>
